<!DOCTYPE html>
<!-- Tiny V10: question blink curve restored on mobile; laptop transition render budget. -->
<html lang="vi">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script id="tiny-performance-profile">
            /* Performance profile: animated background adapts, story timing/audio/product links stay unchanged. */
            window.TINY_PERF = ( () => {
                const qs = new URLSearchParams(location.search);
                const quality = qs.get('tinyfx');
                const touch = matchMedia('(pointer:coarse)').matches;
                const constrained = touch || (navigator.deviceMemory && navigator.deviceMemory <= 6) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
                const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (touch && matchMedia('(max-width:900px)').matches && !/Windows|Macintosh|X11/i.test(navigator.userAgent));
                const lite = mobile || (quality === 'full' ? false : quality === 'lite' ? true : !!constrained);
                document.documentElement.classList.toggle('tiny-lite', lite);
                document.documentElement.classList.toggle('tiny-mobile', mobile);
                const maxCanvasPixels = mobile ? 365000 : lite ? 1250000 : 2100000;
                function canvasDpr(w, h, maxDpr=1.6) {
                    return Math.max(mobile ? .48 : .55, Math.min(devicePixelRatio || 1, mobile ? .84 : lite ? 1.15 : maxDpr, Math.sqrt(maxCanvasPixels / Math.max(1, w * h))));
                }
                return {
                    lite,
                    mobile,
                    canvasDpr,
                    ambientFps: mobile ? 60 : lite ? 24 : 60,
                    roverFps: mobile ? 45 : lite ? 30 : 60,
                    orbitFps: mobile ? 45 : lite ? 24 : 60,
                    leafFps: mobile ? 60 : lite ? 24 : 60
                };

            }
            )();
        </script>
        <meta charset="UTF-8">
        <title>Sự thức giấc của Tiny - Ngày 20/10</title>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #05020a; /* Đen pha chút tím cực tối cho có chiều sâu */
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                overflow: hidden;
                user-select: none;
                font-family: 'Courier Prime', monospace;
                position: relative;
            }

            /* Bầu trời sao (lớp nền, không che nhân vật và chữ) */
            #tiny-sky {
                position: absolute;
                inset: 0;
                z-index: 1;
                overflow: hidden;
                pointer-events: none;
                opacity: 0;
                visibility: hidden;
                transition: opacity 1.6s ease-in-out, visibility 1.6s;
            }

            #tiny-sky.hien-thi {
                opacity: 1;
                visibility: visible;
            }

            #tiny-sky:not(.hien-thi) .tiny-star, #tiny-sky:not(.hien-thi) .tiny-meteor {
                animation-play-state: paused;
            }

            .tiny-star {
                position: absolute;
                width: var(--size);
                height: var(--size);
                background: #ffffff; /* Trắng bạc cho sao */
                border-radius: 50%;
                box-shadow: 0 0 8px 2px rgba(220, 208, 255, 0.75); /* Ánh sáng bạc pha tím nhạt */
                animation: tinyTwinkle var(--twinkle) ease-in-out var(--delay) infinite alternate;
            }

            @keyframes tinyTwinkle {
                from {
                    opacity: .18;
                    transform: scale(.65);
                }

                to {
                    opacity: .95;
                    transform: scale(1.25);
                }
            }

            /* Sao băng phối màu bạc và đuôi ánh tím */
            .tiny-meteor {
                position: absolute;
                width: clamp(62px, 10vw, 135px);
                height: 2px;
                opacity: 0;
                background: linear-gradient(to right, rgba(255,255,255,.98) 0%, rgba(220,198,255,.86) 13%, rgba(147,112,219,.34) 52%, rgba(147,112,219,0) 100%);
                border-radius: 99px;
                box-shadow: 0 0 8px rgba(216,191,216,.80);
                transform-origin: 0 50%;
                transform: translate3d(0,0,0) rotate(var(--meteor-angle, -25deg));
                will-change: transform, opacity;
                animation: tinyMeteor var(--period) linear var(--meteor-delay) infinite;
            }

            .tiny-meteor::before {
                content: '';
                position: absolute;
                left: -3px;
                top: -2.5px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #ffffff;
                box-shadow: 0 0 10px 3px rgba(240,230,255,.95);
            }

            @keyframes tinyMeteor {
                0% {
                    opacity: 0;
                    transform: translate3d(0,0,0) rotate(var(--meteor-angle));
                }

                8% {
                    opacity: .70;
                    transform: translate3d(var(--meteor-x08),var(--meteor-y08),0) rotate(var(--meteor-angle));
                }

                20% {
                    opacity: 1;
                    transform: translate3d(var(--meteor-x20),var(--meteor-y20),0) rotate(var(--meteor-angle));
                }

                36% {
                    opacity: .65;
                    transform: translate3d(var(--meteor-x36),var(--meteor-y36),0) rotate(var(--meteor-angle));
                }

                53% {
                    opacity: 0;
                    transform: translate3d(var(--meteor-x53),var(--meteor-y53),0) rotate(var(--meteor-angle));
                }

                100% {
                    opacity: 0;
                    transform: translate3d(var(--meteor-x100),var(--meteor-y100),0) rotate(var(--meteor-angle));
                }
            }

            /* Đổi lớp phủ ánh sáng hồng cũ thành Tím mộng mơ */
            #pink-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(135deg, rgba(147, 112, 219, 0.45) 0%, rgba(106, 13, 173, 0.2) 30%, transparent 70%);
                opacity: 0;
                transition: opacity 3s ease-in-out;
                pointer-events: none;
                z-index: 3;
            }

            #pink-overlay.hien-thi {
                opacity: 1;
            }

            :root {
                --anh-cao: 88vh;
            }

            /* Đổi ánh sáng vàng ở gấu váy sang ánh Tím Bạc dịu nhẹ */
            #vang-overlay {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(to top, rgba(216, 191, 216, .52) 0%, rgba(186, 143, 219, .32) calc(var(--anh-cao) * .16), rgba(230, 230, 250, .13) calc(var(--anh-cao) * .29), rgba(255, 255, 255, 0) calc(var(--anh-cao) * .43));
                opacity: 0;
                pointer-events: none;
                z-index: 5;
            }

            #vang-overlay.loe {
                animation: loeVang 3.5s ease-out forwards;
            }

            /* Đổi lớp phủ xanh dương sang Tím Huyền Ảo */
            #xanh-overlay {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 5;
                opacity: 0;
                background: linear-gradient(to top, rgba(112, 41, 199, 0.64) 0%, rgba(147, 112, 219, 0.40) calc(var(--anh-cao) * 0.34), rgba(216, 191, 216, 0.18) calc(var(--anh-cao) * 0.54), transparent calc(var(--anh-cao) * 0.75));
                transition: opacity 1.4s ease-in-out;
            }

            #xanh-overlay.hien-thi {
                opacity: 1;
            }

            @keyframes loeVang {
                0% {
                    opacity: 0;
                    filter: brightness(1);
                }

                15% {
                    opacity: 1;
                    filter: brightness(1.15);
                }

                100% {
                    opacity: 1;
                    filter: brightness(1);
                }
            }

            /* Ảnh hai cô gái áo dài */
            #anh-hai-nguoi {
                position: absolute;
                right: 2vw;
                bottom: 0;
                height: var(--anh-cao);
                max-width: 60vw;
                object-fit: contain;
                object-position: right bottom;
                z-index: 4;
                pointer-events: none;
                opacity: 0;
                transform: translateY(24px);
                transition: opacity 3s ease-in-out 0.8s, transform 3s ease-out 0.8s;
                filter: drop-shadow(0 0 2px rgba(75, 0, 130, 0.8)) drop-shadow(0 0 10px rgba(216, 191, 216, 0.6));
            }

            #anh-hai-nguoi.hien-thi {
                opacity: 1;
                transform: translateY(0);
            }

            #co-hoa {
                position: absolute;
                left: 0;
                bottom: 0;
                z-index: 7;
                overflow: visible;
                pointer-events: none;
                opacity: 0;
                transition: opacity 2s ease-in-out 0.6s;
                filter: drop-shadow(0 0 2px rgba(75, 0, 130, 0.8)) drop-shadow(0 0 8px rgba(216, 191, 216, 0.5));
            }

            #co-hoa.hien-thi {
                opacity: 1;
            }

            #co-hoa .co-ngan {
                fill: none;
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            #co-hoa .net {
                fill: none;
                stroke: var(--mau, #e6e6fa); /* Trắng ánh tím (Lavender) cho cỏ hoa */
                stroke-width: 1.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 1 1;
                stroke-dashoffset: 1;
            }

            #co-hoa.hien-thi .net {
                animation: veNet 3s ease-out forwards;
                animation-delay: var(--d, 0s);
            }

            #co-hoa.xong .net {
                animation: none;
                stroke-dashoffset: 0;
            }

            @keyframes veNet {
                to {
                    stroke-dashoffset: 0;
                }
            }

            #co-hoa .lac {
                animation: gio 3.4s ease-in-out infinite alternate;
            }

            @keyframes gio {
                from {
                    transform: rotate(calc(var(--a, 2deg) * -1));
                }

                to {
                    transform: rotate(var(--a, 2deg));
                }
            }

            #laCanvas {
                position: absolute;
                top: 0;
                right: 0;
                width: 50vw;
                height: 100%;
                z-index: 6;
                pointer-events: none;
                -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 30%);
                mask-image: linear-gradient(to right, transparent 0%, #000 30%);
                opacity: 0;
                transition: opacity 3s ease-in-out;
            }

            #laCanvas.hien-thi {
                opacity: 1;
            }

            #natureCanvas {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 2;
                pointer-events: none;
                opacity: 0;
                transition: opacity 3s ease-in-out;
            }

            #natureCanvas.hien-thi {
                opacity: 1;
            }

            /* Chữ phủ hiệu ứng phát sáng trắng bạc và tím lung linh */
            .text-layer {
                color: #f3e8ff; /* Tím rất nhạt/trắng bạc */
                letter-spacing: 4px;
                position: absolute;
                width: 100%;
                text-align: center;
                opacity: 0;
                transition: opacity 0.7s ease-in-out;
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(186, 85, 211, 0.7);
                pointer-events: none;
                z-index: 10;
            }

            .text-layer.hien-thi {
                opacity: 1;
            }

            @keyframes lacLu {
                0%, 100% {
                    transform: rotate(-2deg);
                }

                50% {
                    transform: rotate(2deg);
                }
            }

            #text-4.hien-thi {
                animation: lacLu 3s ease-in-out infinite;
            }

            #text-1 {
                top: 50%;
                transform: translateY(-50%);
                font-size: 4rem;
            }

            #text-2 {
                bottom: 15%;
                font-size: 3rem;
            }

            #text-3 {
                top: 15%;
                font-size: 2.5rem;
            }

            #text-4 {
                bottom: 15%;
                font-size: 3.5rem;
            }

            #text-5 {
                top: 10%;
                left: 0;
                width: 66%;
                font-size: 2.4rem;
                color: #e8d7ff; /* Tím nhạt mộng mơ */
                text-shadow: 0 0 15px #9370db;
                line-height: 1.35;
            }

            #text-5 .chu-20-10 {
                display: block;
            }

            #text-5 .chu-20-10:last-child {
                margin-top: .08em;
            }

            #text-6 {
                top: 15%;
                left: 0;
                width: 100%;
                font-size: 3rem;
                color: #f3e8ff;
                text-shadow: 0 0 18px rgba(216, 191, 216, 0.95), 0 0 36px rgba(147, 112, 219, 0.65);
            }

            #text-7 {
                top: 12%;
                left: 0;
                width: 100%;
                font-size: 2.75rem;
                color: #ffffff;
                text-shadow: 0 0 16px rgba(255,255,255,.95), 0 0 34px rgba(186,85,211,.55);
            }

            #lower-stars {
                position: absolute;
                inset: 0;
                z-index: 2;
                pointer-events: none;
                opacity: 0;
                transition: opacity .9s ease-in-out;
            }

            #lower-stars.hien-thi {
                opacity: 1;
            }

            #lower-stars:not(.hien-thi) .lower-star {
                animation-play-state: paused;
            }

            .lower-star {
                position: absolute;
                width: var(--size);
                height: var(--size);
                background: #ffffff;
                border-radius: 50%;
                box-shadow: 0 0 8px 1px rgba(216,191,216,.75);
                animation: tinyTwinkle var(--twinkle) ease-in-out var(--delay) infinite alternate;
            }
